[project]
name = "bookshelf-backend"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Lint frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      - name: Lint backend
        working-directory: backend
        run: |
          pip install $(grep '^ruff==' requirements-dev.txt)
          ruff check . --output-format=github

  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: docker/setup-buildx-action@v4

      # cache plasti, da se pip install ne ponavlja ob vsakem zagonu
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: bookshelf-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image
        run: docker save bookshelf-backend:${{ github.sha }} | gzip > backend-image.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: backend-image
          path: backend-image.tar.gz
          compression-level: 0

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookshelf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bookshelf_test
        run: |
          pip install -r requirements-dev.txt
          pytest
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: |
            backend/htmlcov
            backend/coverage.xml
            frontend/coverage

  deploy:
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.netlify.outputs.url }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: backend-image

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bookshelf-backend"
          gunzip -c backend-image.tar.gz | docker load
          docker tag "bookshelf-backend:$GITHUB_SHA" "$image:$GITHUB_SHA"
          docker tag "bookshelf-backend:$GITHUB_SHA" "$image:latest"
          docker push --all-tags "$image"
          echo "ref=$image:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy backend
        run: curl -fsS -G "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" --data-urlencode "imgURL=${{ steps.image.outputs.ref }}"

      - name: Deploy frontend
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@27 deploy --dir=dist --prod --no-build --json > netlify.json
          echo "url=$(jq -r .url netlify.json)" >> "$GITHUB_OUTPUT"

      - name: Check deployment
        run: |
          curl -fsS --retry 5 --retry-all-errors "${{ steps.netlify.outputs.url }}" > /dev/null
          curl -fsS --retry 20 --retry-delay 15 --retry-all-errors "${{ vars.VITE_API_URL }}/health/db"